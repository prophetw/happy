# Paste inside the existing HTTPS server { ... }; keep its current public port.
# For relay-only on 192.168.99.55:8193; reuse the existing TLS configuration.
location = /home-relay {
    absolute_redirect off;
    return 308 /home-relay/$is_args$args;
}

location ^~ /home-relay/ {
    # The trailing slash strips /home-relay/ before forwarding to the root API.
    proxy_pass http://192.168.99.55:8193/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    client_max_body_size 100m;
}
